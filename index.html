<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Galactic Math Wars</title>
<meta name="theme-color" content="#05060d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Math Wars">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060d; --panel:rgba(14,18,36,.88); --line:rgba(140,170,255,.25);
  --text:#e8ecff; --dim:#8f99c4; --gold:#ffd84a; --good:#4ade80; --bad:#ff5266; --blue:#5cc8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#stars{position:fixed;inset:0;z-index:0}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
.screen.on{display:flex}
h1,h2,h3,.orb{font-family:Orbitron,sans-serif;letter-spacing:.04em}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.btn{background:linear-gradient(#ffe26b,#e0a800);color:#1b1300;font-family:Orbitron,sans-serif;font-weight:900;font-size:18px;padding:14px 28px;border-radius:14px;box-shadow:0 4px 0 #8a6500,0 0 24px rgba(255,216,74,.35);letter-spacing:.06em;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6500}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{font-size:13px;padding:9px 14px;border-radius:10px}

/* ---------- title ---------- */
#title{align-items:center;justify-content:center;text-align:center;gap:18px;padding:16px}
#title h1{font-size:clamp(38px,8vw,92px);margin:0;color:var(--gold);font-weight:900;line-height:1;text-shadow:0 0 30px rgba(255,216,74,.45);-webkit-text-stroke:1px #a57d00}
#title h1 span{display:block;font-size:.45em;color:#fff;-webkit-text-stroke:0;letter-spacing:.3em;margin-top:10px;text-shadow:0 0 14px var(--blue)}
#title p{color:var(--dim);font-size:18px;max-width:520px}
.gear{position:absolute;top:14px;right:16px}
#setBtn0,#setBtn1,#setBtn2{font-family:system-ui,sans-serif;font-size:22px;line-height:1;padding:7px 11px}
.seg{margin-top:4px}.seg .btn{min-width:150px}
.box .lab{margin:18px 0 0;color:var(--dim);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.qvis{font-size:clamp(24px,5vw,38px);line-height:1.25;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px}
.qvis:empty{display:none}
.qvis .op{font-family:Orbitron;font-weight:900;color:var(--dim);margin:0 12px}
.qvis .st{display:inline-block;position:relative}
.qvis .gone{opacity:.35}
.qvis .gone::after{content:"";position:absolute;left:-2px;right:-2px;top:46%;height:4px;border-radius:2px;background:var(--bad);transform:rotate(-35deg)}

/* ---------- crawl ---------- */
#crawl{overflow:hidden;cursor:pointer}
#crawl .far{position:absolute;top:40%;width:100%;text-align:center;color:var(--blue);font-size:clamp(18px,3vw,30px);animation:fadeFar 4.5s forwards}
@keyframes fadeFar{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
#crawl .stage{position:absolute;inset:0;perspective:340px;perspective-origin:50% 0%;display:flex;justify-content:center}
#crawl .text{position:absolute;top:100%;width:min(640px,90vw);color:var(--gold);font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(20px,3.6vw,34px);text-align:justify;line-height:1.45;transform-origin:50% 100%;transform:rotateX(24deg);animation:crawl 34s linear 4s forwards;opacity:0}
#crawl .text h2{text-align:center;font-size:1.3em;margin:0 0 .6em}
#crawl .text h3{text-align:center;margin:0}
@keyframes crawl{0%{top:100%;opacity:1}100%{top:-260%;opacity:1}}
#crawl .skip{position:absolute;right:16px;bottom:16px;z-index:3}

/* ---------- select ---------- */
#select{overflow-y:auto;padding:24px 16px 40px;align-items:center}
#select h2{margin:8px 0 4px;color:var(--gold);text-align:center}
#select .sub{color:var(--dim);margin:0 0 16px;text-align:center}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:min(980px,100%)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 8px 12px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-3px)}
.card.sel{border-color:var(--gold);box-shadow:0 0 24px rgba(255,216,74,.35)}
.card svg{width:100%;height:150px}
.card .nm{font-weight:900;font-size:15px}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(980px,100%)}
.diff{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left}
.diff.sel{border-color:var(--gold);box-shadow:0 0 18px rgba(255,216,74,.3)}
.diff b{font-family:Orbitron;font-size:16px;color:var(--gold)}
.diff small{display:block;color:var(--dim);margin-top:2px}
.diff div{margin-top:6px;font-size:14px}
#select .go{margin-top:22px}

/* ---------- map ---------- */
#map .bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(rgba(5,6,13,.95),rgba(5,6,13,0));flex-wrap:wrap}
#map .bar .who{display:flex;align-items:center;gap:8px;font-weight:900}
#map .bar .who svg{width:44px;height:52px}
#map .bar .stat{color:var(--dim);font-size:14px}
#map .bar .stat b{color:var(--text)}
#map .bar .sp{flex:1}
#map .wrap{flex:1;position:relative;min-height:0}
#mapsvg{position:absolute;inset:0;width:100%;height:100%}
.planet{cursor:pointer}
.planet .ring{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:6 6;opacity:0}
.planet.next .ring{opacity:1;animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.planet.locked{opacity:.38}
.planet text{font-family:Orbitron;font-weight:700;fill:#fff;font-size:15px;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:4px}
.planet text.foe{font-family:Nunito;font-size:13px;fill:#ffb3b3;font-weight:800}
.planet text.done{fill:var(--good)}
#map .hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-weight:800;text-align:center;max-width:90%;pointer-events:none}

/* ---------- battle ---------- */
#battle .top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(5,6,13,.85);z-index:2}
#battle .top .pl{flex:1;text-align:center;font-family:Orbitron;font-weight:700;color:var(--gold);font-size:16px}
.arena{flex:1;position:relative;min-height:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4vw;overflow:hidden}
.arena .scene{position:absolute;inset:0;z-index:0}
.arena .scene svg{width:100%;height:100%;display:block}
.rain{animation:rain .5s linear infinite}@keyframes rain{to{transform:translate(-16px,52px)}}
.snow{animation:snow 9s linear infinite}@keyframes snow{to{transform:translate(-30px,500px)}}
.flash{animation:flash 4s steps(1) infinite}@keyframes flash{0%,8%,14%,60%,64%{opacity:1}4%,10%,18%,62%,100%{opacity:0}}
.fighter{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:min(34vw,300px);height:100%;justify-content:flex-end;padding-bottom:2%}
.fighter .fig{width:100%;flex:0 1 auto;height:min(100%,330px);display:flex;justify-content:center;align-items:flex-end;min-height:0}
.fighter .fig svg{height:100%;max-width:100%;animation:bob 2.6s ease-in-out infinite;will-change:transform}
.foe .fig svg{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-6px)}}
.fighter .tag{background:rgba(0,0,0,.6);padding:4px 12px;border-radius:10px;font-weight:900;font-size:15px;margin-top:4px;white-space:nowrap}
.hp{display:flex;gap:6px;margin-bottom:6px;background:rgba(0,0,0,.45);padding:6px 9px;border-radius:20px}
.pip{width:22px;height:22px;border-radius:50%;transition:all .3s}
.hero .pip{background:radial-gradient(circle at 35% 35%,#fff,#5cc8ff 45%,#1460c8);box-shadow:0 0 10px #5cc8ff}
.foe .pip{background:radial-gradient(circle at 35% 35%,#fff,#ff5266 45%,#a00018);box-shadow:0 0 10px #ff5266}
.pip.lost{background:#222!important;box-shadow:none!important;transform:scale(.7);opacity:.5}
.pip.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.7);filter:brightness(3)}100%{transform:scale(.7)}}
.hero.lunge .fig{animation:lungeR .55s ease}
.foe.lunge .fig{animation:lungeL .55s ease}
@keyframes lungeR{45%{transform:translateX(14vw) rotate(4deg)}}
@keyframes lungeL{45%{transform:translateX(-14vw) rotate(-4deg)}}
.hero{--kb:-24px}.foe{--kb:24px}
.hit .fig{animation:hit .55s .18s}
@keyframes hit{0%,100%{transform:none;filter:none}15%{transform:translateX(var(--kb));filter:brightness(2.2) drop-shadow(0 0 16px #ff3344)}35%{transform:translateX(calc(var(--kb) * -.6))}55%{transform:translateX(calc(var(--kb) * .35))}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.bolt{position:absolute;top:45%;width:70px;height:7px;border-radius:4px}
.bolt.r{animation:boltR .32s linear forwards}
.bolt.l{animation:boltL .32s linear forwards}
@keyframes boltR{from{left:28%}to{left:72%}}
@keyframes boltL{from{left:68%}to{left:24%}}
.spark{position:absolute;top:38%;width:130px;height:130px;margin:-65px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6 20%,transparent 60%);animation:spark .45s forwards}
@keyframes spark{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
.zap{position:absolute;inset:0;width:100%;height:100%;animation:zap .5s steps(5) forwards}
@keyframes zap{0%,40%,80%{opacity:1}20%,60%{opacity:.2}100%{opacity:0}}
.float{position:absolute;top:22%;font-family:Orbitron;font-weight:900;font-size:34px;animation:floatUp 1s forwards;text-shadow:0 0 12px currentColor}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}

.panel{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;gap:16px;align-items:stretch;justify-content:center;flex-wrap:wrap;z-index:2}
.qbox{flex:1 1 300px;max-width:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.qtext{font-family:Orbitron;font-weight:900;font-size:clamp(28px,5.5vw,52px);line-height:1.1}
.qlabel{color:var(--dim);font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.choices{flex:1 1 100%;max-width:820px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.choice{position:relative;height:76px;border-radius:14px;background:linear-gradient(#2a3460,#1a2142);font-family:Orbitron;font-weight:900;font-size:clamp(16px,4.4vw,34px);box-shadow:0 4px 0 #0b0f22,inset 0 0 0 2px var(--line);transition:transform .08s,opacity .3s}
.choice:hover{box-shadow:0 4px 0 #0b0f22,inset 0 0 0 2px var(--blue)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0f22}
.choice small{position:absolute;top:5px;left:9px;font-family:Nunito;font-size:11px;color:var(--dim)}
.choice.good{background:linear-gradient(#5be38c,#1f9c4f);color:#03240f;box-shadow:0 0 22px #4ade80}
.choice.bad{background:linear-gradient(#ff7a88,#c0283c);animation:shake .4s}
.choice.dim{opacity:.35}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:24px;font-weight:800;font-size:16px;max-width:520px}
.fb .tip{display:block;color:var(--gold);font-weight:700;margin-top:4px}
.fb .right{color:var(--good)}.fb .wrong{color:var(--bad)}
.cont{display:none}
.waiting .choices{pointer-events:none}.waiting .cont{display:block}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.box{background:linear-gradient(#141a36,#0b0f22);border:2px solid var(--line);border-radius:22px;padding:22px;max-width:620px;width:100%;text-align:center;box-shadow:0 0 60px rgba(92,200,255,.18);animation:boxIn .35s}
@keyframes boxIn{from{transform:scale(.85);opacity:0}}
.box h2{margin:0 0 6px;color:var(--gold);font-size:clamp(22px,4vw,32px)}
.box p{color:#cfd6ff;font-size:17px;margin:8px 0}
.box .vs{display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0}
.box .vs svg{width:min(34vw,170px);height:min(42vw,210px)}
.box .vs .x{font-family:Orbitron;font-weight:900;font-size:40px;color:var(--bad);text-shadow:0 0 18px var(--bad)}
.box .taunt{font-style:italic;color:#ffb3b3}
.box .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#confetti{position:fixed;inset:0;z-index:30;pointer-events:none}

@media (max-height:640px){
  .choice{height:56px}
  .qtext{font-size:30px}
  .panel{padding:8px 12px 10px}
}
@media (max-width:520px){
  .arena{padding:0 2vw}
  .fighter{width:46vw}
  .fighter .tag{font-size:12px}
  .choices{gap:6px}.choice{height:62px}
  .pip{width:16px;height:16px}
  .hp{gap:4px;padding:5px 7px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="svgdefs"><defs>
  <linearGradient id="vol" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></linearGradient>
  <radialGradient id="sph" cx=".32" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
</defs></svg>
<canvas id="stars"></canvas>

<section id="title" class="screen">
  <h1>GALACTIC<br>MATH WARS<span data-i18n="title.sub"></span></h1>
  <p data-i18n="title.p"></p>
  <button class="btn" id="startBtn" data-i18n="title.start"></button>
  <button class="btn ghost small" id="continueBtn" style="display:none" data-i18n="title.continue"></button>
  <button class="btn ghost small gear" id="setBtn0" aria-label="Settings">⚙</button>
</section>

<section id="crawl" class="screen">
  <div class="far orb" data-i18n="crawl.far"></div>
  <div class="stage"><div class="text">
    <h3>Episode M</h3>
    <h2 data-i18n="crawl.h"></h2>
    <p data-i18n="crawl.p1"></p>
    <p data-i18n="crawl.p2"></p>
    <p data-i18n="crawl.p3"></p>
  </div></div>
  <button class="btn ghost small skip" id="skipBtn" data-i18n="crawl.skip"></button>
</section>

<section id="select" class="screen">
  <h2 data-i18n="sel.hero"></h2>
  <p class="sub" data-i18n="sel.heroSub"></p>
  <div class="heroes" id="heroes"></div>
  <h2 style="margin-top:26px" data-i18n="sel.level"></h2>
  <p class="sub" data-i18n="sel.levelSub"></p>
  <div class="diffs" id="diffs"></div>
  <button class="btn go" id="goBtn" data-i18n="sel.go"></button>
</section>

<section id="map" class="screen">
  <div class="bar">
    <div class="who" id="who"></div>
    <div class="stat" id="mapStats"></div>
    <div class="sp"></div>
    <button class="btn ghost small" id="changeBtn" data-i18n="map.change"></button>
    <button class="btn ghost small" id="setBtn1" aria-label="Settings">⚙</button>
  </div>
  <div class="wrap">
    <svg id="mapsvg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="hint" id="mapHint"></div>
  </div>
</section>

<section id="battle" class="screen">
  <div class="top">
    <button class="btn ghost small" id="fleeBtn" data-i18n="bat.map"></button>
    <div class="pl" id="bPlanet"></div>
    <button class="btn ghost small" id="setBtn2" aria-label="Settings">⚙</button>
  </div>
  <div class="arena" id="arena">
    <div class="scene" id="scene"></div>
    <div class="fighter hero" id="fHero"><div class="hp" id="hpHero"></div><div class="fig" id="figHero"></div><div class="tag" id="tagHero"></div></div>
    <div class="fighter foe" id="fFoe"><div class="hp" id="hpFoe"></div><div class="fig" id="figFoe"></div><div class="tag" id="tagFoe"></div></div>
    <div class="fx" id="fx"></div>
  </div>
  <div class="panel" id="panel">
    <div class="qbox">
      <div class="qlabel" id="qlabel"></div>
      <div class="qtext" id="qtext"></div>
      <div class="qvis" id="qvis"></div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="cont"><button class="btn" id="contBtn" data-i18n="bat.gotit"></button></div>
  </div>
</section>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<canvas id="confetti"></canvas>

<script>
/* =====================================================================
   Data
   ===================================================================== */
const HEROES = [
  {id:'luke',  name:'Luke Skywalker', look:{art:'luke',   weapon:'saber',   color:'#4aa8ff'}},
  {id:'leia',  name:'Princess Leia', nameNo:'Prinsesse Leia',  look:{art:'leia',   weapon:'blaster', color:'#ff4545'}},

];

const START = {name:'Yavin 4', sub:'Rebel base', subNo:'Opprørsbasen', x:70, y:300};
const PLANETS = [
  {id:'tatooine', name:'Tatooine', x:170, y:500, r:30, c:['#ffe2a0','#c98a3d'],
   foe:{name:'Boba Fett', taunt:'"You\'re worth a lot of credits... if you get the sums wrong."', tauntNo:'«Du er verdt mange kreditter ... hvis du regner feil.»',

  {id:'kamino', name:'Kamino', x:300, y:330, r:28, c:['#c8e6ff','#3a6f9a'],
   foe:{name:'Jango Fett', taunt:'"My clones count faster than you."', tauntNo:'«Klonene mine regner raskere enn deg.»',
        look:{art:'jango', weapon:'blaster', color:'#ff5a3d'}}},
  {id:'naboo', name:'Naboo', x:440, y:500, r:30, c:['#c4f2b0','#2f8a52'],
   foe:{name:'Darth Maul', taunt:'"At last we will see how sharp your numbers are."', tauntNo:'«Endelig skal vi se hvor skarpe tallene dine er.»',
        look:{art:'maul', weapon:'double', color:'#ff2a2a'}}},
  {id:'geonosis', name:'Geonosis', x:540, y:290, r:28, c:['#ffb37a','#a8461e'],
   foe:{name:'Count Dooku', taunt:'"Your arithmetic is weak, young one."', tauntNo:'«Regningen din er svak, unge venn.»',

  {id:'utapau', name:'Utapau', x:680, y:470, r:28, c:['#e6dcc0','#8a7a58'],
   foe:{name:'General Grievous', taunt:'"Your calculator will make a fine addition to my collection!"', tauntNo:'«Kalkulatoren din blir et fint tilskudd til samlingen min!»',

  {id:'starkiller', name:'Starkiller Base', nameNo:'Starkiller-basen', x:770, y:240, r:30, c:['#f4fbff','#7f9db6'],
   foe:{name:'Kylo Ren', taunt:'"Let the old numbers die. Or answer them, if you must."', tauntNo:'«La de gamle tallene dø. Eller svar på dem, hvis du må.»',
        look:{art:'kylo', weapon:'cross', color:'#ff2a2a'}}},

function localizeData(){
  const set=(o,f)=>{ if(o[f+'En']===undefined) o[f+'En']=o[f]; o[f]=(S.lang==='no'&&o[f+'No'])||o[f+'En']; };
  HEROES.forEach(h=>set(h,'name'));
  PLANETS.forEach(p=>{ set(p,'name'); set(p.foe,'name'); set(p.foe,'taunt'); });
  set(START,'sub');
  Object.values(DIFFS).forEach(d=>{ set(d,'name'); set(d,'age'); set(d,'desc'); });
}

function figureSVG(L, flip){
  const inner=(ART[L.art]||ART.luke)(L);
  return `<svg viewBox="-14 -50 248 344" xmlns="http://www.w3.org/2000/svg" overflow="visible">`
    +`<ellipse cx="108" cy="290" rx="58" ry="6" fill="rgba(0,0,0,.28)"/>`

}

/* =====================================================================
   Math questions
   ===================================================================== */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

function addHint(a,b){
  const s=a+b;
  if (a>=10 && b>=10){
    const ta=a-a%10, tb=b-b%10, oa=a%10, ob=b%10;
    return t('h.addSplit',ta,tb,oa,ob,s);
  }
  const big=Math.max(a,b), small=Math.min(a,b);
  if (big<10 && s>10){ const need=10-big; return t('h.makeTen',big,need,small-need,s); }
  if (small<=5){ let seq=[]; for(let i=1;i<=small;i++) seq.push(big+i); return t('h.countUp',big,small,seq.join(', ')); }
  return t('h.addGen',a,b,s);
}
function subHint(a,b){
  const d=a-b;
  if (b===0) return t('h.sub0',a);
  if (b<=5 && a<=20){ let seq=[]; for(let i=1;i<=b;i++) seq.push(a-i); return t('h.countBack',a,b,seq.join(', ')); }
  if (b>=10){ const tb=b-b%10, ob=b%10; return t('h.subTens',a,tb,ob,a-tb,d); }
  return t('h.subUp',a,b,d);
}
function mulHint(a,b){
  const p=a*b;
  if (b===1||a===1) return t('h.mul1',p);
  if (b===10||a===10) return t('h.mul10',p);
  const n=Math.min(a,b), m=Math.max(a,b);
  if (n<=5){ let seq=[]; for(let i=1;i<=n;i++) seq.push(m*i); return t('h.mulSkip',m,n,seq.join(', ')); }
  return t('h.mulSplit',m,n,p);
}
function bigMulHint(a,b){
  const tn=a-a%10, o=a%10;
  return t('h.bigMul',a,b,tn,o);
}

const Q = {
  add(max){ const a=rnd(Math.max(0,Math.floor(max*.15)),max-1), b=rnd(1,max-a); return {text:`${a} + ${b}`, ans:a+b, traps:[a+b+10,a+b-10,Math.abs(a-b)], hint:addHint(a,b)}; },
  sub(max){ const a=rnd(Math.max(2,Math.floor(max*.3)),max), b=rnd(1,a); return {text:`${a} − ${b}`, ans:a-b, traps:[a+b,a-b+10,a-b-10], hint:subHint(a,b)}; },
  missAdd(max){ const a=rnd(1,max-2), c=rnd(a+1,max); return {text:`${a} + ? = ${c}`, ans:c-a, traps:[c+a,c], label:'missing', hint:t('h.missAdd',a,c)}; },
  mul(tables,maxB){ let a=pick(tables), b=rnd(1,maxB); if(Math.random()<.5)[a,b]=[b,a]; return {text:`${a} × ${b}`, ans:a*b, traps:[a+b,a*(b+1),a*(b-1),(a+1)*b,(a-1)*b], hint:mulHint(a,b)}; },
  div(tables,maxQ){ const b=pick(tables), q=rnd(1,maxQ), a=b*q; return {text:`${a} ÷ ${b}`, ans:q, traps:[a-b,q+1,q-1,b], hint:t('h.div',a,b,q)}; },
  missMul(tables){ const a=pick(tables), b=rnd(2,10); return {text:`${a} × ? = ${a*b}`, ans:b, traps:[a*b-a,b+1,b-1], label:'missing', hint:t('h.missMul',a,b)}; },
  bigMul(maxA){ const a=rnd(12,maxA), b=rnd(3,9); return {text:`${a} × ${b}`, ans:a*b, traps:[(a-a%10)*b+a%10,a*b+10,a*b-10,a*b+b,a*b-b], hint:bigMulHint(a,b)}; },
  order(){ const a=rnd(2,20), b=rnd(2,9), c=rnd(2,9);
    if (Math.random()<.5) return {text:`${a} + ${b} × ${c}`, ans:a+b*c, traps:[(a+b)*c], label:'order', hint:t('h.orderAdd',a,b,c)};
    const big=b*c+a; return {text:`${big} − ${b} × ${c}`, ans:big-b*c, traps:[(big-b)*c,big-b-c], label:'order', hint:t('h.orderSub',big,b,c)}; },
  paren(){ const a=rnd(2,12), b=rnd(2,9), c=rnd(2,9); return {text:`(${a} + ${b}) × ${c}`, ans:(a+b)*c, traps:[a+b*c], label:'paren', hint:t('h.paren',a,b,c)}; },
  percent(){ const p=pick([10,25,50,20]), base={10:10,25:4,50:2,20:5}[p], n=base*rnd(2,25);
    return {text:t('q.percent',p,n), ans:n*p/100, traps:[n/2,n/10,n/4,n-p], hint:t('h.percent',p,t('h.pctWord')[p],n)}; },
  ewokAdd(max){ const a=rnd(1,max-1), b=rnd(1,max-a); return {text:`${a} + ${b}`, ans:a+b, vis:[a,'+',b], label:'count', nChoices:3, hint:t('h.ewokAdd',Array.from({length:a+b},(_,i)=>i+1).join(', '))}; },
  ewokSub(max){ const a=rnd(2,max), b=rnd(1,a-1); return {text:`${a} − ${b}`, ans:a-b, vis:[a,'−',b], label:'count', nChoices:3, hint:t('h.ewokSub',a,b,a-b)}; },
  square(){ const n=rnd(2,15); return {text:`${n}²`, ans:n*n, traps:[n*2,n*n+n,n*n-n], hint:t('h.square',n)}; },
};

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// Five options (three on the Ewok level): the answer, up to two "common mistake" traps, then nearby numbers.
function makeChoices(q){
  const a=q.ans, out=new Set([a]), N=q.nChoices||5;
  const ok=v=>Number.isInteger(v)&&v>=0&&!out.has(v);
  for(const t of shuffle((q.traps||[]).slice())){ if(out.size>=3) break; if(ok(t)) out.add(t); }
  const near=shuffle([a+1,a-1,a+2,a-2,a+3,a-3,...(a>=20?[a+10,a-10]:[])]);
  for(const v of near){ if(out.size>=N) break; if(ok(v)) out.add(v); }
  for(let g=4; out.size<N; g++) if(ok(a+g)) out.add(a+g);
  return shuffle([...out]);
}
function makeQuestion(diff,lvl){
  const t=lvl/7, k=[];
  if (diff==='ewok'){
    const m=lvl<3?5:(lvl<6?7:10);
    k.push(()=>Q.ewokAdd(m),()=>Q.ewokAdd(m));
    if (lvl>=1) k.push(()=>Q.ewokSub(m));
  } else if (diff==='youngling'){
    const m=10+Math.round(t*10);
    k.push(()=>Q.add(m),()=>Q.add(m),()=>Q.sub(m),()=>Q.sub(m));
    if (lvl>=4) k.push(()=>Q.missAdd(m));
  } else if (diff==='padawan'){
    const m=20+Math.round(t*80);
    k.push(()=>Q.add(m),()=>Q.sub(m));
    if (lvl>=2) k.push(()=>Q.mul(lvl>=5?[2,3,4,5,10]:[2,5,10],10));
    if (lvl>=4) k.push(()=>Q.missAdd(m));
    if (lvl>=6) k.push(()=>Q.div([2,5,10],10));
  } else if (diff==='knight'){
    const m=100+Math.round(t*900);
    const tb = lvl>=4 ? [3,4,6,7,8,9,11,12] : [2,3,4,5,6,7,8,9];
    k.push(()=>Q.add(m),()=>Q.sub(m),()=>Q.mul(tb,10),()=>Q.mul(tb,10),()=>Q.div(tb,10));
    if (lvl>=3) k.push(()=>Q.missMul(tb));
  } else {
    k.push(()=>Q.bigMul(25+lvl*10),()=>Q.div([6,7,8,9,11,12],12),()=>Q.order(),()=>Q.percent(),()=>Q.square());
    if (lvl>=3) k.push(()=>Q.paren(),()=>Q.mul([11,12,13,14,15],12));
  }
  let q, tries=0;
  do { q=pick(k)(); } while (B && B.q && q.text===B.q.text && tries++<10);
  return q;
}

let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,dur,type='sine',vol=.12,f2,delay=0){
  if(!S.sound) return; const c=ac(); if(!c) return;
  const t0=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.02);
}
const SFX={

  blaster(){ tone(1600,.2,'square',.06,180); },
  zap(){ for(let i=0;i<5;i++) tone(rnd(300,1400),.08,'sawtooth',.05,rnd(80,300),i*.07); },
  wrong(){ tone(180,.4,'sawtooth',.08,70); },
  win(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.12,null,i*.13)); },
  lose(){ [392,349,311,262].forEach((f,i)=>tone(f,.35,'triangle',.11,null,i*.22)); },
  fly(){ tone(80,1.3,'sawtooth',.05,900); },

    for(let k=0;k<26;k++) g+=`<rect x="${(x-r+R()*2*r).toFixed(0)}" y="${(y-r+R()*2*r).toFixed(0)}" width="${(3+R()*8).toFixed(0)}" height="2" fill="#6a6e76"/>`;
    g+=`<rect x="${x-r}" y="${y+1}" width="${2*r}" height="4" fill="#3e424a"/>`;
    g+=`<circle cx="${x-16}" cy="${y-17}" r="13" fill="#8a8f97" stroke="#4a4e56" stroke-width="2"/><circle cx="${x-16}" cy="${y-17}" r="8" fill="none" stroke="#5a5e66" stroke-width="1.5"/><circle cx="${x-16}" cy="${y-17}" r="3" fill="#3a3e46"/>`
      +ST(`M${x-16} ${y-30} L${x-16} ${y-4} M${x-29} ${y-17} L${x-3} ${y-17}`,'#5a5e66',1);
  }
  g+=`</g><circle cx="${x}" cy="${y}" r="${r}" fill="url(#sph)"/>`;
  if (p.id==='tatooine') g+=`<circle cx="${x+48}" cy="${y-34}" r="7" fill="#fff4b0" style="filter:drop-shadow(0 0 6px #ffe680)"/><circle cx="${x+62}" cy="${y-22}" r="5" fill="#ffc46b" style="filter:drop-shadow(0 0 5px #ffb04a)"/>`;
  return g;
}
function shipSVG(){ // the Millennium Falcon, seen from above, pointing right
  return `<g id="ship"><g transform="scale(1.15)">
    <path d="M-18 -4 Q-22 0 -18 4" stroke="#7cf" stroke-width="5" fill="none" style="filter:drop-shadow(0 0 5px #6cf)"/>
    <path d="M-1 -19 A19 19 0 1 0 -1 19 L10 15 L28 13 L28 3.5 L13 3.5 L13 -3.5 L28 -3.5 L28 -13 L10 -15Z" fill="#cfd2d6" stroke="#6a6e76" stroke-width="1.4"/>
    <circle cx="-1" cy="0" r="7" fill="#b9bdc3" stroke="#6a6e76" stroke-width="1"/><circle cx="-1" cy="0" r="2.5" fill="#7a7e86"/>
    <path d="M-12 -12 L-6 -6 M-14 8 L-7 4 M4 -14 L2 -7 M-18 0 L-9 0" stroke="#8a8e96" stroke-width="1"/>
    <rect x="-10" y="-14" width="7" height="4" fill="#b8573a" opacity=".8"/><rect x="2" y="8" width="5" height="3" fill="#b8573a" opacity=".8"/>
    <path d="M4 14 L14 22 L20 20 L12 12Z" fill="#cfd2d6" stroke="#6a6e76" stroke-width="1.2"/><circle cx="17" cy="21" r="3.2" fill="#2a2e36" stroke="#6a6e76" stroke-width="1"/>
    <circle cx="-7" cy="-9" r="3" fill="#a9adb3" stroke="#6a6e76" stroke-width="1"/></g></g>`;
}
function drawMap(){
  const svg=$('mapsvg'); const n=S.conquered;
  let h=`<defs><radialGradient id="neb1"><stop offset="0" stop-color="#5a2a8a" stop-opacity=".45"/><stop offset="1" stop-color="#5a2a8a" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2"><stop offset="0" stop-color="#1a5a8a" stop-opacity=".45"/><stop offset="1" stop-color="#1a5a8a" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb3"><stop offset="0" stop-color="#8a2a3a" stop-opacity=".35"/><stop offset="1" stop-color="#8a2a3a" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="300" cy="300" rx="380" ry="240" fill="url(#neb2)"/><ellipse cx="700" cy="380" rx="360" ry="220" fill="url(#neb1)"/><ellipse cx="880" cy="140" rx="200" ry="160" fill="url(#neb3)"/>`;
  // route
  const pts=[START,...PLANETS];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], done=i<n;
    h+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${done?'#ffd84a':'#8fa4ff'}" stroke-width="${done?4:2.5}" stroke-dasharray="${done?'0':'8 10'}" opacity="${done?.85:.4}"/>`;
  }
  // start base
  h+=`<g class="planet"><circle cx="${START.x}" cy="${START.y}" r="20" fill="#3a6a3a" stroke="#7ac07a" stroke-width="2"/><circle cx="${START.x-6}" cy="${START.y-5}" r="5" fill="#5a9a5a"/>
     <text x="${START.x}" y="${START.y+42}">${START.name}</text><text class="foe" x="${START.x}" y="${START.y+58}" style="fill:#9fe09f">${START.sub}</text></g>`;
  PLANETS.forEach((p,i)=>{
    const st = i<n?'done':(i===n?'next':'locked');
    h+=`<g class="planet ${st}" data-i="${i}">${planetArt(p,i)}<circle class="ring" cx="${p.x}" cy="${p.y}" r="${p.r+9}"/>
      <circle cx="${p.x}" cy="${p.y}" r="${p.r+16}" fill="transparent"/>
      <text x="${p.x}" y="${p.y+p.r+24}">${p.name}</text>
      <text class="foe ${st==='done'?'done':''}" x="${p.x}" y="${p.y+p.r+41}">${st==='done'?t('map.freed'):(st==='next'?'⚔ '+p.foe.name:'?')}</text></g>`;
  });
  h+=shipSVG();
  svg.innerHTML=h;
  placeShip();
  svg.querySelectorAll('.planet[data-i]').forEach(el=>el.onclick=()=>clickPlanet(+el.dataset.i));
  const hr=hero();
  $('who').innerHTML=figureSVG(hr.look)+`<div>${hr.name}<div class="stat">${DIFFS[S.diff].name}</div></div>`;
  const st=S.stats, pct=st.total?Math.round(100*st.right/st.total):0;
  $('mapStats').innerHTML=t('map.stats',n,PLANETS.length,st.right,st.total,pct,st.best);
  $('mapHint').innerHTML = n>=PLANETS.length ? t('map.allFree') : t('map.next',PLANETS[n].name,PLANETS[n].foe.name);
}
function placeShip(){
  const s=document.getElementById('ship'); if(!s) return;
  s.setAttribute('transform',`translate(${shipPos.x},${shipPos.y-34}) rotate(${shipAng})`);
}
function openMap(){
  closeModal(); show('map');
  if(!flying){ const p=nodePos(S.conquered-1); shipPos={x:p.x,y:p.y}; }
  drawMap();
}
function clickPlanet(i){
  if (flying) return;
  if (i>S.conquered){ const h=$('mapHint'); h.innerHTML=t('map.locked',PLANETS[i].name,PLANETS[S.conquered].name); return; }
  const to=PLANETS[i], from={...shipPos};
  const dist=Math.hypot(to.x-from.x,to.y-from.y);
  if (dist<1){ intro(i); return; }
  flying=true; SFX.fly();
  shipAng=Math.atan2(to.y-from.y,to.x-from.x)*180/Math.PI;
  const dur=Math.min(1600,500+dist*2.2), t0=performance.now();
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    shipPos={x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e}; placeShip();
    if(k<1) requestAnimationFrame(step); else { flying=false; shipAng=0; placeShip(); intro(i); }
  })(t0);
}
function intro(i){
  const p=PLANETS[i], hr=hero(), boss=p.deathstar;
  modal(`<h2>${boss?t('intro.final'):p.name.toUpperCase()}</h2>
    <p>${boss?t('intro.ds'):t('intro.rules',p.foe.name,p.name)}</p>
    <div class="vs">${figureSVG(hr.look)}<div class="x">VS</div>${figureSVG(p.foe.look,true)}</div>
    <p class="taunt">${p.foe.name}: ${p.foe.taunt}</p>
    <p style="color:var(--dim);font-size:14px">${t('intro.how',p.foe.name)}${p.foe.hp?`<br><b style="color:var(--bad)">${t('intro.strong',p.foe.name,p.foe.hp,MAXHP)}</b>`:''}</p>
    <div class="row"><button class="btn ghost" onclick="closeModal()">${t('intro.notYet')}</button><button class="btn" id="fightBtn">${t('intro.fight')}</button></div>`);
  $('fightBtn').onclick=()=>startBattle(i);
}
$('changeBtn').onclick=openSelect;

/* ---- battle ---- */
let B=null;
const MAXHP=5;
function pips(n,max){ let h=''; for(let i=0;i<max;i++) h+=`<div class="pip${i>=n?' lost':''}"></div>`; return h; }
function startBattle(i){
  closeModal();
  const p=PLANETS[i], hr=hero();
  B={pi:i, heroHP:MAXHP, foeHP:p.foe.hp||MAXHP, foeMax:p.foe.hp||MAXHP, q:null, input:'', busy:false, streak:0};
  $('bPlanet').textContent=p.name;
  $('scene').innerHTML=sceneSVG(p.id);
  $('figHero').innerHTML=figureSVG(hr.look); $('figFoe').innerHTML=figureSVG(p.foe.look,true);
  $('tagHero').textContent=hr.name; $('tagFoe').textContent=p.foe.name;
  renderHP(); show('battle'); nextQuestion();
}
function renderHP(){ $('hpHero').innerHTML=pips(B.heroHP,MAXHP); $('hpFoe').innerHTML=pips(B.foeHP,B.foeMax); }
function nextQuestion(){
  B.q=makeQuestion(S.diff,B.pi); B.choices=makeChoices(B.q); B.input=''; B.busy=false;
  $('qtext').textContent=B.q.text+(B.q.text.includes('?')?'':' = ?');
  $('qlabel').textContent=t('lbl.'+(B.q.label||'pick'));
  $('qvis').innerHTML=B.q.vis?visHTML(...B.q.vis):'';
  $('choices').style.gridTemplateColumns=`repeat(${B.choices.length},minmax(0,1fr))`; $('choices').style.maxWidth=B.choices.length<5?'520px':'';
  $('fb').innerHTML=B.streak>=3?`<span class="right">${t('bat.streak',B.streak)}</span>`:'';
  $('panel').classList.remove('waiting');
  $('choices').innerHTML=B.choices.map((v,i)=>`<button class="choice" data-i="${i}"><small>${i+1}</small>${v}</button>`).join('');
  $('choices').querySelectorAll('.choice').forEach(b=>b.addEventListener('pointerdown',e=>{ e.preventDefault(); choose(+b.dataset.i); }));
}
function visHTML(a,op,b){
  const star=cls=>`<span class="st${cls}">⭐</span>`;
  if(op==='+') return star('').repeat(a)+(a?`<span class="op">+</span>`:'')+star('').repeat(b);
  return star('').repeat(a-b)+star(' gone').repeat(b);
}
function choose(i){
  if(!B||B.busy||!$('battle').classList.contains('on')||$('panel').classList.contains('waiting')) return;
  if(i<0||i>=B.choices.length) return;
  B.input=String(B.choices[i]); B.picked=i; answer();
}
function markChoices(){
  $('choices').querySelectorAll('.choice').forEach((b,i)=>{
    const v=B.choices[i];
    b.classList.add(v===B.q.ans?'good':(i===B.picked?'bad':'dim'));
  });
}
addEventListener('keydown',e=>{
  if($('modal').classList.contains('on')){ if(e.key==='Enter'){ const b=$('modalBox').querySelector('.btn:last-of-type'); if(b) b.click(); } return; }
  if(!$('battle').classList.contains('on')) return;
  if($('panel').classList.contains('waiting')){ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); $('contBtn').click(); } return; }
  if(/^[1-5]$/.test(e.key)) choose(+e.key-1);
});
$('contBtn').onclick=()=>{ if(B) afterHit(); };

function attackFx(fromHero, look){
  const fx=$('fx'), atk=fromHero?$('fHero'):$('fFoe'), def=fromHero?$('fFoe'):$('fHero');
  const ranged = look.weapon==='blaster', zap = look.weapon==='lightning';
  if(!ranged && !zap){ atk.classList.remove('lunge'); void atk.offsetWidth; atk.classList.add('lunge'); SFX.saber(); SFX.clash(); }
  if(ranged){ SFX.blaster(); const b=document.createElement('div'); b.className='bolt '+(fromHero?'r':'l'); b.style.background=look.color; b.style.boxShadow=`0 0 12px ${look.color},0 0 24px ${look.color}`; fx.appendChild(b); setTimeout(()=>b.remove(),400); }
  if(zap){ SFX.zap(); const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('class','zap'); s.setAttribute('viewBox','0 0 100 100'); s.setAttribute('preserveAspectRatio','none');
    let paths=''; for(let j=0;j<3;j++){ let d=`M${fromHero?30:70} ${45+j*3}`; for(let x=1;x<=8;x++){ const xx=fromHero?30+x*5:70-x*5; d+=` L${xx} ${40+Math.random()*16}`; } paths+=`<path d="${d}" stroke="${look.color}" stroke-width=".8" fill="none" style="filter:drop-shadow(0 0 2px ${look.color})"/>`; }
    s.innerHTML=paths; fx.appendChild(s); setTimeout(()=>s.remove(),550); }
  setTimeout(()=>{
    def.classList.remove('hit'); void def.offsetWidth; def.classList.add('hit');
    const sp=document.createElement('div'); sp.className='spark'; sp.style.left=fromHero?'74%':'26%'; fx.appendChild(sp); setTimeout(()=>sp.remove(),500);
    const fl=document.createElement('div'); fl.className='float'; fl.textContent='−1'; fl.style.left=fromHero?'72%':'22%'; fl.style.color=fromHero?'#ff5266':'#5cc8ff'; fx.appendChild(fl); setTimeout(()=>fl.remove(),1000);
  }, ranged?260:(zap?200:220));
}
function answer(){
  B.busy=true;
  const val=parseInt(B.input,10), ok=val===B.q.ans, p=PLANETS[B.pi];
  S.stats.total++;
  if(ok){
    S.stats.right++; B.streak++; S.stats.best=Math.max(S.stats.best,B.streak);
    markChoices();
    $('fb').innerHTML=`<span class="right">${pick(t('bat.praise'))}</span>`;
    attackFx(true, hero().look);
    setTimeout(()=>{ B.foeHP--; renderHP(); const pp=$('hpFoe').children[B.foeHP]; if(pp) pp.classList.add('pop'); }, 450);
    setTimeout(()=>afterHit(), 1150);
  } else {
    B.streak=0;
    markChoices();
    $('fb').innerHTML=`<span class="wrong">${t('bat.oops',B.q.text,B.q.text.includes('?'),B.q.ans)}</span><span class="tip">💡 ${B.q.hint}</span>`;
    attackFx(false, p.foe.look);
    setTimeout(()=>{ B.heroHP--; renderHP(); const pp=$('hpHero').children[B.heroHP]; if(pp) pp.classList.add('pop'); SFX.wrong(); }, 450);
    setTimeout(()=>{ $('panel').classList.add('waiting'); }, 700);
  }
  save();
}
function afterHit(){
  $('panel').classList.remove('waiting');
  if(B.foeHP<=0) return winBattle();
  if(B.heroHP<=0) return loseBattle();
  nextQuestion();
}
function winBattle(){
  const p=PLANETS[B.pi], first=B.pi===S.conquered;
  if(first) S.conquered++;
  save(); SFX.win(); B.busy=true;
  if(p.deathstar && first){ return finale(); }
  const nxt=PLANETS[S.conquered];
  modal(`<h2>${t('win.title')}</h2><div class="vs">${figureSVG(hero().look)}</div>
    <p>${t('win.text',p.foe.name,p.name)}</p>
    ${nxt&&first?`<p style="color:var(--gold)">${t('win.next',nxt.name,nxt.foe.name)}</p>`:''}
    <div class="row"><button class="btn" id="toMap">${t('win.toMap')}</button></div>`);
  confetti(1800);
  $('toMap').onclick=openMap;
}
function loseBattle(){
  const p=PLANETS[B.pi]; SFX.lose(); B.busy=true;
  modal(`<h2 style="color:var(--bad)">${t('lose.title')}</h2><div class="vs">${figureSVG(p.foe.look,true)}</div>
    <p>${t('lose.text',p.foe.name)}</p><p style="color:var(--gold)">${t('lose.tip')}</p>
    <div class="row"><button class="btn ghost" id="toMap">${t('lose.map')}</button><button class="btn" id="retry">${t('lose.retry')}</button></div>`);
  $('toMap').onclick=openMap; $('retry').onclick=()=>startBattle(B.pi);
}
function finale(){
  const st=S.stats, pct=st.total?Math.round(100*st.right/st.total):0, hr=hero();
  const di=DIFF_ORDER.indexOf(S.diff), harder=DIFF_ORDER[di+1];
  modal(`<h2>${t('fin.title')}</h2>
    <div class="vs">${figureSVG(hr.look)}</div>
    <p>${t('fin.text',hr.name)}</p>
    <p>${t('fin.stats',st.right,st.total,pct,st.best)}</p>
    <div class="row"><button class="btn ghost" id="toMap">${t('lose.map')}</button>${harder?`<button class="btn" id="harder">${t('fin.harder',DIFFS[harder].name.toUpperCase())}</button>`:`<button class="btn" id="again">${t('fin.again')}</button>`}</div>`);
  confetti(6000);
  $('toMap').onclick=openMap;
  const again=()=>{ const keep={hero:S.hero,sound:S.sound,lang:S.lang,diff:harder||S.diff,seenCrawl:true}; S=Object.assign(freshSave(),keep); save(); openMap(); };
  if($('harder')) $('harder').onclick=again; if($('again')) $('again').onclick=again;
}
$('fleeBtn').onclick=()=>{ if(confirm(t('bat.flee'))) openMap(); };
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal' && $('map').classList.contains('on')) closeModal(); });

/* ---- confetti / stars ---- */
function confetti(ms){
  const cv=$('confetti'), cx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#ffd84a','#5cc8ff','#4ade80','#ff5266','#b55cff','#fff'];
  const P=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:3+Math.random()*4,c:pick(cols),a:Math.random()*6}));
  const t0=performance.now();
  (function f(now){ cx.clearRect(0,0,cv.width,cv.height);
    for(const p of P){ p.x+=p.vx; p.y+=p.vy; p.a+=.1; if(p.y>cv.height+10 && now-t0<ms){ p.y=-10; p.x=Math.random()*cv.width; }
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); }
    if(now-t0<ms+2500) requestAnimationFrame(f); else cx.clearRect(0,0,cv.width,cv.height); })(t0);
}

applyLang(); show('title');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
